<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>존댓말 차원 탐험대 | 초등 3학년 국어 높임표현 게이미피케이션</title>
  <meta name="description" content="초등학교 3학년 국어 높임표현을 재미있는 2D 픽셀 레트로 게이미피케이션으로 배우는 에듀테크 서비스">

  <!-- Pixel & Clean Korean Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=Noto+Sans+KR:wght@400;700;900&family=Galmuri11:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-api/SH-DungGeunMo@1.0.0/sun-dunggeunmo.css">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body class="pixel-theme">
  <!-- CRT Retro Overlay Effect -->
  <div class="crt-overlay"></div>

  <!-- Top Global Navigation Bar (GNB) -->
  <header id="gnb" class="gnb-header">
    <div class="gnb-left">
      <h1 class="game-title" id="gnb-logo">🌌 존댓말 차원 탐험대</h1>
      <span class="version-tag">v2.0 3학년 2학기</span>
    </div>

    <div class="gnb-center" id="gnb-user-info">
      <!-- Dynamic User Info (Student/Teacher status) -->
      <span class="user-badge" id="gnb-user-name">로그인 필요</span>
    </div>

    <div class="gnb-right">
      <button id="btn-master-trigger" class="pixel-btn btn-xs btn-outline" title="제작자 마스터 모드 (0106)">🔑 0106</button>
      <button id="btn-sound-toggle" class="pixel-btn btn-xs btn-icon" title="음향 온/오프">🔊</button>
      <button id="btn-exit-game" class="pixel-btn btn-xs btn-danger hidden">게임 종료</button>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app-view" class="main-container">
    <!-- Dynamic views (Login, Lobby, Quest, Dungeon, Teacher, Master) will render here -->
  </main>

  <!-- Global Modal Container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="pixel-modal">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Sound Engine & Application Entry Point -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
